<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Bouncing Ball Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }
        
        #canvas {
            background-color: #2a2a2a;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .info {
            margin-top: 20px;
            text-align: center;
        }
        
        .controls {
            margin: 20px 0;
        }
        
        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>🎾 Circular Bouncing Ball Simulation</h1>
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="resetBtn">Reset</button>
    </div>
    <canvas id="canvas"></canvas>
    <div class="info">
        <p>Status: <span id="status">Ready</span></p>
        <p>Click "Start" to begin the simulation!</p>
        <p>Ball bounces inside a circle with gravity and leaves trails. Watch for the exit!</p>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 800;

        // Configuration constants
        const CENTER_X = canvas.width / 2;
        const CENTER_Y = canvas.height / 2;
        const CIRCLE_RADIUS = 350; // Radius of circular boundary
        const GRAVITY = 0.5; // Gravity acceleration
        const DAMPING = 0.98; // Energy loss on bounce (slight damping)
        const BALL_RADIUS = 15;
        
        // Exit configuration (gap in the circle)
        const EXIT_ANGLE_START = Math.PI / 2; // 90 degrees (top)
        const EXIT_ANGLE_END = Math.PI / 2 + Math.PI / 12; // 90 + 15 = 105 degrees
        const EXIT_WIDTH = EXIT_ANGLE_END - EXIT_ANGLE_START;

        /**
         * Ball class representing a bouncing ball with gravity
         */
        class Ball {
            constructor(x, y, vx, vy, radius, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = radius;
                this.color = color;
            }

            /**
             * Update ball position with gravity and handle circular boundary collisions
             * Returns 'collision' if ball bounced, 'exit' if ball went through exit, or null
             */
            update() {
                // Apply gravity
                this.vy += GRAVITY;

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Calculate distance from center
                const dx = this.x - CENTER_X;
                const dy = this.y - CENTER_Y;
                const distanceFromCenter = Math.sqrt(dx * dx + dy * dy);

                // Check if ball is hitting the circular boundary
                if (distanceFromCenter + this.radius >= CIRCLE_RADIUS) {
                    // Calculate angle of ball position
                    const angle = Math.atan2(dy, dx);
                    
                    // Normalize angle to 0-2π range
                    const normalizedAngle = angle < 0 ? angle + 2 * Math.PI : angle;
                    
                    // Check if ball is at the exit gap
                    if (normalizedAngle >= EXIT_ANGLE_START && normalizedAngle <= EXIT_ANGLE_END) {
                        // Ball went through the exit
                        return 'exit';
                    }
                    
                    // Ball hits the boundary - reflect it
                    // Position ball exactly on the boundary
                    const distance = CIRCLE_RADIUS - this.radius;
                    this.x = CENTER_X + (dx / distanceFromCenter) * distance;
                    this.y = CENTER_Y + (dy / distanceFromCenter) * distance;
                    
                    // Calculate normal vector (pointing inward)
                    const normalX = -dx / distanceFromCenter;
                    const normalY = -dy / distanceFromCenter;
                    
                    // Reflect velocity vector
                    const dotProduct = this.vx * normalX + this.vy * normalY;
                    this.vx = (this.vx - 2 * dotProduct * normalX) * DAMPING;
                    this.vy = (this.vy - 2 * dotProduct * normalY) * DAMPING;
                    
                    return 'collision';
                }

                return null;
            }

            /**
             * Draw the ball on the canvas
             */
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
            }
        }

        // Simulation state
        let ball = null;
        let animationId = null;
        let isRunning = false;
        let trails = []; // Store trail positions

        /**
         * Draw the circular boundary with exit gap
         */
        function drawBoundary() {
            ctx.beginPath();
            // Draw circle with a gap for the exit
            ctx.arc(CENTER_X, CENTER_Y, CIRCLE_RADIUS, EXIT_ANGLE_END, EXIT_ANGLE_START + 2 * Math.PI);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.closePath();
            
            // Draw exit markers (small lines at gap edges)
            const exitStartX = CENTER_X + Math.cos(EXIT_ANGLE_START) * CIRCLE_RADIUS;
            const exitStartY = CENTER_Y + Math.sin(EXIT_ANGLE_START) * CIRCLE_RADIUS;
            const exitEndX = CENTER_X + Math.cos(EXIT_ANGLE_END) * CIRCLE_RADIUS;
            const exitEndY = CENTER_Y + Math.sin(EXIT_ANGLE_END) * CIRCLE_RADIUS;
            
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(exitStartX - 10 * Math.cos(EXIT_ANGLE_START), exitStartY - 10 * Math.sin(EXIT_ANGLE_START));
            ctx.lineTo(exitStartX + 10 * Math.cos(EXIT_ANGLE_START), exitStartY + 10 * Math.sin(EXIT_ANGLE_START));
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(exitEndX - 10 * Math.cos(EXIT_ANGLE_END), exitEndY - 10 * Math.sin(EXIT_ANGLE_END));
            ctx.lineTo(exitEndX + 10 * Math.cos(EXIT_ANGLE_END), exitEndY + 10 * Math.sin(EXIT_ANGLE_END));
            ctx.stroke();
        }

        /**
         * Draw trails left by bounces
         */
        function drawTrails() {
            trails.forEach((trail, index) => {
                const alpha = Math.max(0, 1 - (Date.now() - trail.time) / 2000); // Fade over 2 seconds
                ctx.beginPath();
                ctx.arc(trail.x, trail.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 200, 100, ${alpha})`;
                ctx.fill();
                ctx.closePath();
            });
            
            // Remove old trails
            trails = trails.filter(trail => Date.now() - trail.time < 2000);
        }

        /**
         * Create initial ball
         */
        function createBall() {
            // Start ball near center with small initial velocity
            const x = CENTER_X + (Math.random() - 0.5) * 100;
            const y = CENTER_Y - 100;
            const vx = (Math.random() - 0.5) * 4;
            const vy = 0;
            const color = '#4CAF50';
            
            return new Ball(x, y, vx, vy, BALL_RADIUS, color);
        }

        /**
         * Initialize simulation with one ball
         */
        function initSimulation() {
            ball = createBall();
            trails = [];
            updateStatus('Ready');
        }

        /**
         * Update status display
         */
        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }

        /**
         * Main animation loop
         */
        function animate() {
            // Clear canvas
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw boundary
            drawBoundary();
            
            // Draw trails
            drawTrails();

            // Update and draw ball if it exists
            if (ball) {
                const result = ball.update();

                if (result === 'collision') {
                    // Add trail at collision point
                    trails.push({
                        x: ball.x,
                        y: ball.y,
                        time: Date.now()
                    });
                } else if (result === 'exit') {
                    // Ball went through exit - remove it
                    ball = null;
                    updateStatus('Ball escaped through exit!');
                }

                // Draw the ball if it still exists
                if (ball) {
                    ball.draw();
                }
            }

            // Continue animation loop
            if (isRunning) {
                animationId = requestAnimationFrame(animate);
            }
        }

        /**
         * Start the simulation
         */
        function start() {
            if (!isRunning) {
                isRunning = true;
                document.getElementById('startBtn').disabled = true;
                updateStatus('Running');
                animate();
            }
        }

        /**
         * Reset the simulation
         */
        function reset() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            // Clear canvas
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Reinitialize
            initSimulation();
            
            // Draw boundary and initial ball
            drawBoundary();
            if (ball) {
                ball.draw();
            }
            
            document.getElementById('startBtn').disabled = false;
        }

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', start);
        document.getElementById('resetBtn').addEventListener('click', reset);

        // Initialize the simulation
        initSimulation();
        drawBoundary();
        if (ball) {
            ball.draw();
        }
    </script>
</body>
</html>
